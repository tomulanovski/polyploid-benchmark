# Versions follow the paper where it gives them (SciPy 1.12.0). polybench, GRAMPA/GRANDMA, PADRE and PhyloNet run here.
name: polybench
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - ete3
  - six
  - networkx
  - pandas
  - scipy=1.12.0
  - numpy<2
  - matplotlib
  - pyyaml
  - pytest
  - psutil        # GRANDMA
  - tqdm          # GRANDMA
  - pyvis         # GRANDMA
  - openjdk=11    # PADRE, PhyloNet
  - pip:
      - phylonetwork==2.2.2
